services:
  redis:
    image: redis:7-alpine
    container_name: scrape_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:15
    container_name: scrape_postgres
    environment:
      POSTGRES_USER: scrape_user
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: scrape_db
    ports:
      - "5433:5432"  
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrape_user -d scrape_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web_api:
    build:
      context: ./backend        
      dockerfile: Dockerfile    
    container_name: scrape_web_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/backend_app  
    working_dir: /backend_app
    environment:
      - DATABASE_URL=postgresql://scrape_user:secret@db:5432/scrape_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scrape_celery_worker
    command: celery -A app.tasks.celery_app worker --loglevel=info
    volumes:
      - ./backend:/backend_app
    working_dir: /backend_app
    environment:
      - DATABASE_URL=postgresql://scrape_user:secret@db:5432/scrape_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://web_api:8000/api/
    depends_on:
      - web_api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: